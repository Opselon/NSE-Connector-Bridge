# NSE MT5 Bridge — test, build, release.
#
# Jobs:
#   test-linux    ruff + format + mypy + security + unit + mock-integration
#                 tests (Linux).
#   build-windows same gates on Windows (proves Windows imports work) +
#                 PyInstaller exe build. The real-MT5 e2e suite is NEVER
#                 run here: GitHub-hosted runners have no MT5 terminal,
#                 and a required-MT5 test fails loudly without one
#                 (tests/conftest.py). E2E is manual, Windows-with-MT5-only
#                 (see docs/RELEASE.md).
#   release       tags only (v*): exe + setup exe + SHA-256s + release
#                 manifest + release notes. Stable vs prerelease by tag
#                 name: v1.2.3 = stable, v1.2.3-rc.1 = prerelease.
#
# Spec §20 gates (all mandatory, all fast — no Wine in PR checks):
#   lint    `ruff check .` (whole repo) + `ruff format --check .`
#   types   `mypy nse_bridge` (pydantic plugin; see pyproject.toml)
#   sec     `bandit -r nse_bridge` + `pip-audit` (both requirement files)
#   tests   unit + mock-integration, with a junit XML artifact uploaded
#           on failure so the failing test names are visible without
#           log access (A1: the Windows test step failed at 3f0950c
#           with logs unreachable — 403 — and no per-test record).
name: Build Windows exe

on:
  push:
    branches: [main, "refactor/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Docs-only PRs get no signal from a test/build gate — skip the run.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Superseded runs on the same ref are cancelled; per-ref groups keep tag
# releases isolated from branch runs (a release is never cancelled by a push).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux gate: lint + types + security + unit + mock-integration tests
  # run FIRST; the Windows build waits on them.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (whole repo)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Static analysis (mypy)
        # The --platform win32 pass type-checks Windows-only branches
        # (e.g. DevFallbackSecretStore refusing Windows) that Linux
        # mypy treats as unreachable: without it a Windows-only type
        # error passes test-linux and fails build-windows (seen at
        # 1d1d213/a95ca31: "Cannot determine type of _path").
        run: |
          python -m mypy nse_bridge
          python -m mypy nse_bridge --platform win32

      - name: Security checks (bandit + pip-audit)
        # Bandit skips (Low severity, reviewed individually):
        #   B101 asserts are the codebase's invariant pattern and the
        #     bridge never runs under `python -O`;
        #   B110 try/except-pass sites are documented best-effort
        #     fallbacks (diagnostics probes, shutdown hooks);
        #   B311 `random` is reconnect/enrolment backoff jitter only —
        #     secrets use the `secrets` module, never `random`;
        #   B404 importing `subprocess` is not a finding — the one call
        #     site (updater restart-installer launch) carries a
        #     `# nosec B603` note and uses a list argv, no shell.
        # pip-audit needs network access to the OSV database; it audits
        # both requirement files (dev includes runtime via -r).
        run: |
          python -m bandit -r nse_bridge --skip B101,B110,B311,B404 -q
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Version files are fresh
        run: python scripts/write_version_info.py --check

      - name: OpenAPI schema matches the registry
        run: |
          python scripts/export_openapi.py /tmp/openapi-check.json
          diff docs/openapi.json /tmp/openapi-check.json

      - name: Run unit + mock-integration tests
        # -rf prints the failing test names in the log; the junit XML
        # is uploaded on failure (next step) so the failing tests are
        # identifiable even when job logs are unreachable.
        run: python -m pytest tests/unit tests/integration -q --junitxml=test-results.xml -rf

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-linux
          path: test-results.xml
          if-no-files-found: warn

      - name: Annotate failing tests (readable without log access)
        # Job logs and artifacts need GitHub auth to download; the
        # junit XML alone does not name the failing tests to a reader
        # without it. This posts each failure as a check-run
        # annotation, readable unauthenticated via the Checks API.
        # The script never fails the build (see scripts/).
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/annotate_test_failures.py --xml test-results.xml --job test-linux

      - name: Marker labelling is complete
        # Covered by tests/unit/test_test_honesty.py inside the suite
        # above; this explicit marker count makes the split visible.
        run: |
          python -m pytest tests/unit -q --collect-only -m unit 2>&1 | tail -1
          python -m pytest tests/integration -q --collect-only -m mock_integration 2>&1 | tail -1

  build-windows:
    needs: test-linux
    runs-on: windows-latest
    # PyInstaller + Inno Setup are slow on hosted Windows; 40 min bounds it.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt includes -r requirements.txt plus the
        # test/lint tools (pytest, ruff, mypy, bandit, pip-audit) this
        # job runs below.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (whole repo)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Static analysis (mypy)
        run: python -m mypy nse_bridge

      - name: Security checks (bandit + pip-audit)
        # Same skips as test-linux (see the comment there).
        run: |
          python -m bandit -r nse_bridge --skip B101,B110,B311,B404 -q
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      # Same suites as Linux — proves the Windows imports work
      # (MetaTrader5 is importable here; the driver import is lazy, so
      # collection succeeds even without a terminal). The real-MT5 e2e
      # suite is deliberately NOT run: no MT5 terminal on this runner.
      - name: Run unit + mock-integration tests on Windows
        # -rf + junit XML: the Windows test step failed at 3f0950c with
        # no per-test record and unreachable logs; the uploaded XML
        # names the failing tests on the next failure.
        run: python -m pytest tests/unit tests/integration -q --junitxml=test-results.xml -rf

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows
          path: test-results.xml
          if-no-files-found: warn

      - name: Annotate failing tests (readable without log access)
        # Same as test-linux (see the comment there): the junit XML
        # names the failing tests only to a reader with auth, so post
        # them as check-run annotations, readable unauthenticated.
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/annotate_test_failures.py --xml test-results.xml --job build-windows

      - name: Build single-file exe
        run: pyinstaller bridge.spec --noconfirm --clean

      - name: Smoke-check the frozen exe (--help + serve + GUI asset + CLI JSON)
        # Three layers against the real frozen binary:
        # 1. --help exits before any server/GUI starts (entry point +
        #    --console/--diagnostic flags parse; PyInstaller bundle is
        #    complete enough to boot Python).
        # 2. Headless serve smoke: the exe binds the loopback API,
        #    /health answers, /ui serves the bundled Control Center
        #    (GUI asset integrity), and the single-instance mutex
        #    rejects a second launch with exit code 2.
        # 3. CLI JSON contract: status/health/mt5 list --json answer
        #    with one parseable JSON document and exit 0 against the
        #    RUNNING instance (same-user secret store provides the
        #    key). No MT5 terminal exists on hosted runners — MT5
        #    fields honestly report down/unknown, which is exactly the
        #    state the honesty contract requires.
        shell: pwsh
        run: |
          dist/NSE-MT5-Bridge.exe --help
          $proc = Start-Process -FilePath "dist/NSE-MT5-Bridge.exe" -ArgumentList "--gui","none","--port","8799" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $ready = $false
            while ((Get-Date) -lt $deadline -and -not $ready) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-WebRequest -Uri "http://127.0.0.1:8799/health" -UseBasicParsing -TimeoutSec 2
                if ($h.StatusCode -eq 200) { $ready = $true }
              } catch { }
            }
            if (-not $ready) { throw "frozen exe /health did not become ready within 90 s" }
            $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8799/ui" -UseBasicParsing -TimeoutSec 15
            if ($ui.StatusCode -ne 200) { throw "/ui (bundled GUI asset) answered HTTP $($ui.StatusCode)" }
            foreach ($cli in @(("status"), ("health"), ("mt5","list"))) {
              $out = & dist/NSE-MT5-Bridge.exe @cli --json 2>$null
              if ($LASTEXITCODE -ne 0) { throw "CLI '$cli' exited with $LASTEXITCODE" }
              ($out -join "`n") | ConvertFrom-Json > $null
            }
            # Single instance: a second launch must refuse fast (exit 2).
            $second = Start-Process -FilePath "dist/NSE-MT5-Bridge.exe" -ArgumentList "--gui","none","--port","8799" -Wait -PassThru
            if ($second.ExitCode -ne 2) { throw "second instance exited $($second.ExitCode), expected 2" }
            Write-Host "frozen exe serve + GUI asset + CLI JSON + single-instance smoke OK"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Build Windows installer (Inno Setup)
        # Proves the .iss compiles on every PR, not just on tags: the
        # setup exe is uploaded with the exe artifact and attached to
        # the release by the release job. Version comes from the single
        # source of truth (nse_bridge.BRIDGE_VERSION); AppVersionInfo
        # is the numeric 4-part quad the version resource needs
        # (AppVersion may carry a prerelease suffix like "-rc.1").
        # windows-latest runners ship Inno Setup, but fall back to a
        # choco install if iscc is not on PATH (the well-known install
        # paths are checked first — choco does not always refresh PATH
        # in the running shell).
        shell: pwsh
        run: |
          $ver = python -c "from nse_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION, end='')"
          $base = ($ver -split '-')[0]
          $quadParts = ($base -split '\.')
          while ($quadParts.Count -lt 4) { $quadParts += '0' }
          $quad = ($quadParts[0..3] -join '.')
          Write-Host "installer version: $ver (version-info $quad)"
          $iscc = $null
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) { $iscc = $cmd.Source }
          if (-not $iscc) {
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
            if (-not $iscc) {
              $cmd = Get-Command iscc -ErrorAction SilentlyContinue
              if ($cmd) { $iscc = $cmd.Source }
            }
          }
          if (-not $iscc) { throw "Inno Setup compiler (iscc) not found and choco install did not provide it" }
          & $iscc /DAppVersion=$ver /DAppVersionInfo=$quad windows\NSE-MT5-Bridge.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }
          $setup = Get-Item dist\NSE-MT5-Bridge-Setup-*.exe
          Write-Host "built $($setup.Name) ($($setup.Length) bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NSE-MT5-Bridge-windows
          path: |
            dist/NSE-MT5-Bridge.exe
            dist/NSE-MT5-Bridge-Setup-*.exe
          if-no-files-found: error

  # Local-processing benchmark (mission §B3 regression tracking). NOT
  # on PRs (keeps PR checks fast): runs on main pushes, tags, and
  # manual dispatch, uploading the JSON report as an artifact so
  # per-commit numbers are comparable over time. The numbers are
  # LOCAL processing only (fake driver, no MT5 IPC, no network — see
  # scripts/bench_local_api.py) and runner-specific; compare
  # same-workflow runs, never the dev-machine baselines in
  # docs/PERFORMANCE.md.
  bench:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run local-processing benchmark
        run: python scripts/bench_local_api.py --samples 400 --out bench-report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-report-${{ github.sha }}
          path: bench-report.json
          if-no-files-found: error

  # Release: tags only. The exe and the setup exe are checksummed +
  # manifested here, and all five files (exe, exe .sha256, setup exe,
  # setup .sha256, manifest) are attached to the GitHub release. No
  # release is ever cut from an untested build: this job needs
  # build-windows, which needs test-linux.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Download exe artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NSE-MT5-Bridge-windows
          path: dist

      - name: Checksum + release manifest
        run: |
          $setup = (Get-Item dist/NSE-MT5-Bridge-Setup-*.exe).FullName
          python scripts/write_release_manifest.py dist/NSE-MT5-Bridge.exe --setup $setup --tag ${{ github.ref_name }}
          type dist/NSE-MT5-Bridge.exe.sha256
          type dist/NSE-MT5-Bridge-Setup-*.exe.sha256
          type dist/release-manifest.json

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/NSE-MT5-Bridge.exe
            dist/NSE-MT5-Bridge.exe.sha256
            dist/NSE-MT5-Bridge-Setup-*.exe
            dist/NSE-MT5-Bridge-Setup-*.exe.sha256
            dist/release-manifest.json
          # v1.2.3-rc.1 (or any tag containing '-') is a prerelease;
          # v1.2.3 is stable. The two are never mixed in one release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
