# NSE MT5 Bridge — test, build, release.
#
# Jobs:
#   test-linux    ruff + format + mypy + security + unit + mock-integration
#                 tests (Linux).
#   build-windows same gates on Windows x64 (proves Windows imports work) +
#                 PyInstaller exe build + Inno Setup installer. The real-MT5
#                 e2e suite is NEVER run here: GitHub-hosted runners have no
#                 MT5 terminal, and a required-MT5 test fails loudly without
#                 one (tests/conftest.py). E2E is manual, Windows-with-MT5-only
#                 (see docs/RELEASE.md).
#   build-unix    matrix: macOS x64 (macos-15-intel) + macOS arm64
#                 (macos-latest) + Linux x64 (ubuntu-latest) + Linux arm64
#                 (ubuntu-24.04-arm). Same gates as build-windows, then a
#                 PyInstaller build (macOS .app -> .dmg, Linux binary ->
#                 tarball) + a headless frozen-binary smoke. PyInstaller
#                 cannot cross-compile — each OS/arch builds natively.
#                 MT5 is Windows-x64-only by design: the core (server, UI,
#                 platform channel) builds and runs on macOS/Linux, terminal
#                 attach reports MT5_WINDOWS_REQUIRED, never faked.
#   build-windows-arm
#                 Windows 11 ARM64 (windows-11-arm): native-arm64 build of
#                 the bridge CORE only — the MetaTrader5 wheel has no
#                 win_arm64 build, so the exe runs but cannot attach to a
#                 terminal (MT5_WINDOWS_REQUIRED). Trading on ARM64 Windows
#                 uses the x64 build (runs under emulation, CAN attach).
#                 Portable exe only, no Inno installer (the .iss is x64).
#   bench         local-processing benchmark (mission §B3), main/tags only.
#   release       tags only (v*): all six platform artifacts + SHA-256s +
#                 release manifest + release notes. Stable vs prerelease by
#                 tag name: v1.2.3 = stable, v1.2.3-rc.1 = prerelease.
#
# Spec §20 gates (all mandatory, all fast — no Wine in PR checks):
#   lint    `ruff check .` (whole repo) + `ruff format --check .`
#   types   `mypy nse_bridge` (pydantic plugin; see pyproject.toml)
#   sec     `bandit -r nse_bridge` + `pip-audit` (both requirement files)
#   tests   unit + mock-integration, with a junit XML artifact uploaded
#           on failure so the failing test names are visible without
#           log access (A1: the Windows test step failed at 3f0950c
#           with logs unreachable — 403 — and no per-test record).
name: Build and release

on:
  push:
    branches: [main, "refactor/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Docs-only PRs get no signal from a test/build gate — skip the run.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Superseded runs on the same ref are cancelled; per-ref groups keep tag
# releases isolated from branch runs (a release is never cancelled by a push).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux gate: lint + types + security + unit + mock-integration tests
  # run FIRST; the Windows build waits on them.
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (whole repo)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Static analysis (mypy)
        # The --platform win32 pass type-checks Windows-only branches
        # (e.g. DevFallbackSecretStore refusing Windows) that Linux
        # mypy treats as unreachable: without it a Windows-only type
        # error passes test-linux and fails build-windows (seen at
        # 1d1d213/a95ca31: "Cannot determine type of _path").
        run: |
          python -m mypy nse_bridge
          python -m mypy nse_bridge --platform win32

      - name: Security checks (bandit + pip-audit)
        # Bandit skips (Low severity, reviewed individually):
        #   B101 asserts are the codebase's invariant pattern and the
        #     bridge never runs under `python -O`;
        #   B110 try/except-pass sites are documented best-effort
        #     fallbacks (diagnostics probes, shutdown hooks);
        #   B311 `random` is reconnect/enrolment backoff jitter only —
        #     secrets use the `secrets` module, never `random`;
        #   B404 importing `subprocess` is not a finding — the one call
        #     site (updater restart-installer launch) carries a
        #     `# nosec B603` note and uses a list argv, no shell.
        # pip-audit needs network access to the OSV database; it audits
        # both requirement files (dev includes runtime via -r).
        run: |
          python -m bandit -r nse_bridge --skip B101,B110,B311,B404 -q
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Version files are fresh
        run: python scripts/write_version_info.py --check

      - name: OpenAPI schema matches the registry
        run: |
          python scripts/export_openapi.py /tmp/openapi-check.json
          diff docs/openapi.json /tmp/openapi-check.json

      - name: Run unit + mock-integration tests
        # -rf prints the failing test names in the log; the junit XML
        # is uploaded on failure (next step) so the failing tests are
        # identifiable even when job logs are unreachable.
        run: python -m pytest tests/unit tests/integration -q --junitxml=test-results.xml -rf

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-linux
          path: test-results.xml
          if-no-files-found: warn

      - name: Annotate failing tests (readable without log access)
        # Job logs and artifacts need GitHub auth to download; the
        # junit XML alone does not name the failing tests to a reader
        # without it. This posts each failure as a check-run
        # annotation, readable unauthenticated via the Checks API.
        # The script never fails the build (see scripts/).
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/annotate_test_failures.py --xml test-results.xml --job test-linux

      - name: Marker labelling is complete
        # Covered by tests/unit/test_test_honesty.py inside the suite
        # above; this explicit marker count makes the split visible.
        run: |
          python -m pytest tests/unit -q --collect-only -m unit 2>&1 | tail -1
          python -m pytest tests/integration -q --collect-only -m mock_integration 2>&1 | tail -1

  build-windows:
    needs: test-linux
    runs-on: windows-latest
    # PyInstaller + Inno Setup are slow on hosted Windows; 40 min bounds it.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # requirements-dev.txt includes -r requirements.txt plus the
        # test/lint tools (pytest, ruff, mypy, bandit, pip-audit) this
        # job runs below.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (whole repo)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Static analysis (mypy)
        run: python -m mypy nse_bridge

      - name: Security checks (bandit + pip-audit)
        # Same skips as test-linux (see the comment there).
        run: |
          python -m bandit -r nse_bridge --skip B101,B110,B311,B404 -q
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      # Same suites as Linux — proves the Windows imports work
      # (MetaTrader5 is importable here; the driver import is lazy, so
      # collection succeeds even without a terminal). The real-MT5 e2e
      # suite is deliberately NOT run: no MT5 terminal on this runner.
      - name: Run unit + mock-integration tests on Windows
        # -rf + junit XML: the Windows test step failed at 3f0950c with
        # no per-test record and unreachable logs; the uploaded XML
        # names the failing tests on the next failure.
        run: python -m pytest tests/unit tests/integration -q --junitxml=test-results.xml -rf

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows
          path: test-results.xml
          if-no-files-found: warn

      - name: Annotate failing tests (readable without log access)
        # Same as test-linux (see the comment there): the junit XML
        # names the failing tests only to a reader with auth, so post
        # them as check-run annotations, readable unauthenticated.
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/annotate_test_failures.py --xml test-results.xml --job build-windows

      - name: Build single-file exe
        run: pyinstaller bridge.spec --noconfirm --clean

      - name: Smoke-check the frozen exe (--help + serve + GUI asset + CLI JSON)
        # Three layers against the real frozen binary:
        # 1. --help exits before any server/GUI starts (entry point +
        #    --console/--diagnostic flags parse; PyInstaller bundle is
        #    complete enough to boot Python).
        # 2. Headless serve smoke: the exe binds the loopback API,
        #    /health answers, /ui serves the bundled Control Center
        #    (GUI asset integrity), and a second launch brings the
        #    running dashboard to front and exits 0 (S1).
        # 3. CLI JSON contract: status/health/mt5 list --json answer
        #    with one parseable JSON document and exit 0 against the
        #    RUNNING instance (same-user secret store provides the
        #    key). No MT5 terminal exists on hosted runners — MT5
        #    fields honestly report down/unknown, which is exactly the
        #    state the honesty contract requires.
        shell: pwsh
        run: |
          dist/NSE-MT5-Bridge.exe --help
          $proc = Start-Process -FilePath "dist/NSE-MT5-Bridge.exe" -ArgumentList "--console","--port","8799" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $ready = $false
            while ((Get-Date) -lt $deadline -and -not $ready) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-WebRequest -Uri "http://127.0.0.1:8799/health" -UseBasicParsing -TimeoutSec 2
                if ($h.StatusCode -eq 200) { $ready = $true }
              } catch { }
            }
            if (-not $ready) {
              # Windowed exe deaths are silent — dump the bridge's own
              # log + data dir so the failure is diagnosable from CI.
              $dataDir = Join-Path $env:LOCALAPPDATA "NSEBridge"
              Write-Host "--- $dataDir contents ---"
              if (Test-Path $dataDir) { Get-ChildItem $dataDir -Recurse | Select-Object FullName, Length | Format-Table | Out-String | Write-Host }
              $log = Join-Path $dataDir "logs\bridge.log"
              if (Test-Path $log) { Write-Host "--- bridge.log (tail) ---"; Get-Content $log -Tail 40 | Write-Host }
              $jsonl = Join-Path $dataDir "logs\bridge.jsonl"
              if (Test-Path $jsonl) { Write-Host "--- bridge.jsonl (tail) ---"; Get-Content $jsonl -Tail 20 | Write-Host }
              throw "frozen exe /health did not become ready within 90 s"
            }
            $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8799/ui" -UseBasicParsing -TimeoutSec 15
            if ($ui.StatusCode -ne 200) { throw "/ui (bundled GUI asset) answered HTTP $($ui.StatusCode)" }
            # CLI JSON contract — via Start-Process -Wait with redirected
            # output: a GUI-SUBSYSTEM exe is NOT awaited by `&` (pwsh
            # returns immediately, $LASTEXITCODE empty, stdout lost);
            # Start-Process waits and the redirected stdout handle also
            # gives the windowed process a valid sys.stdout so the CLI
            # can emit its one JSON document.
            foreach ($cli in @(("status"), ("health"), ("mt5","list"))) {
              $cliName = $cli -join '-'
              $outFile = Join-Path $env:TEMP "cli-$cliName.json"
              $errFile = Join-Path $env:TEMP "cli-$cliName.err.txt"
              # Explicit command-LINE string (pwsh Start-Process mangles
              # element-boundaries of ArgumentList arrays — observed:
              # "status" + "--json" arrived as one token "status--json").
              $argStr = ($cli -join ' ') + ' --json'
              # -Wait has no timeout: a hung CLI would burn the whole
              # 40-min job budget. WaitForExit(60s) fails fast instead.
              $cp = Start-Process -FilePath "dist/NSE-MT5-Bridge.exe" `
                -ArgumentList $argStr -PassThru `
                -RedirectStandardOutput $outFile -RedirectStandardError $errFile
              if (-not $cp.WaitForExit(60000)) { Stop-Process -Id $cp.Id -Force; throw "CLI '$cli' timed out after 60 s" }
              if ($cp.ExitCode -ne 0) {
                Write-Host "--- cli stderr ---"; Get-Content $errFile | Write-Host
                throw "CLI '$cli' exited with $($cp.ExitCode)"
              }
              Get-Content $outFile -Raw | ConvertFrom-Json > $null
            }
            # Single instance (S1): a second launch brings the running
            # dashboard to front and exits 0 — it must never hang (a
            # modal dialog on the failure path blocked the process
            # until the 40-min job timeout; headless runs skip the
            # browser + dialog entirely now). Bounded wait so a future
            # hang fails fast instead of burning the job budget.
            $second = Start-Process -FilePath "dist/NSE-MT5-Bridge.exe" -ArgumentList "--gui","none","--port","8799" -PassThru
            if (-not $second.WaitForExit(60000)) { Stop-Process -Id $second.Id -Force; throw "second instance did not exit within 60 s (bring-to-front hang)" }
            if ($second.ExitCode -ne 0) { throw "second instance exited $($second.ExitCode), expected 0 (bring-to-front)" }
            Write-Host "frozen exe serve + GUI asset + CLI JSON + single-instance smoke OK"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Frozen-exe smoke test via scripts/smoke_frozen_exe.py (S1)
        # S1 (fix/bridge-visible-startup) owns scripts/smoke_frozen_exe.py:
        # start the frozen exe, show UI, answer /ui + status --json.
        # The step activates automatically when the script lands
        # (hashFiles guard) and runs AFTER the inline smoke above, so
        # no release ever depends on a script that is not there yet.
        # Contract for S1: the script takes --exe <path> --port <port>
        # and exits non-zero on any failure. Until it lands, the inline
        # smoke above is the frozen-exe verification. What the smoke
        # covers — and what it does NOT (no real MT5) — is documented
        # in docs/RELEASE.md §3.
        if: hashFiles('scripts/smoke_frozen_exe.py') != ''
        shell: pwsh
        run: python scripts/smoke_frozen_exe.py --exe dist/NSE-MT5-Bridge.exe --port 8799

      - name: Build Windows installer (Inno Setup)
        # Proves the .iss compiles on every PR, not just on tags: the
        # setup exe is uploaded with the exe artifact and attached to
        # the release by the release job. Version comes from the single
        # source of truth (nse_bridge.BRIDGE_VERSION); AppVersionInfo
        # is the numeric 4-part quad the version resource needs
        # (AppVersion may carry a prerelease suffix like "-rc.1").
        # windows-latest runners ship Inno Setup, but fall back to a
        # choco install if iscc is not on PATH (the well-known install
        # paths are checked first — choco does not always refresh PATH
        # in the running shell).
        shell: pwsh
        run: |
          $ver = python -c "from nse_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION, end='')"
          $base = ($ver -split '-')[0]
          $quadParts = ($base -split '\.')
          while ($quadParts.Count -lt 4) { $quadParts += '0' }
          $quad = ($quadParts[0..3] -join '.')
          Write-Host "installer version: $ver (version-info $quad)"
          $iscc = $null
          $cmd = Get-Command iscc -ErrorAction SilentlyContinue
          if ($cmd) { $iscc = $cmd.Source }
          if (-not $iscc) {
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            foreach ($p in @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "${env:ProgramFiles}\Inno Setup 6\ISCC.exe")) {
              if (Test-Path $p) { $iscc = $p; break }
            }
            if (-not $iscc) {
              $cmd = Get-Command iscc -ErrorAction SilentlyContinue
              if ($cmd) { $iscc = $cmd.Source }
            }
          }
          if (-not $iscc) { throw "Inno Setup compiler (iscc) not found and choco install did not provide it" }
          & $iscc /DAppVersion=$ver /DAppVersionInfo=$quad windows\NSE-MT5-Bridge.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed with exit code $LASTEXITCODE" }
          $setup = Get-Item dist\NSE-MT5-Bridge-Setup-*.exe
          Write-Host "built $($setup.Name) ($($setup.Length) bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NSE-MT5-Bridge-windows
          path: |
            dist/NSE-MT5-Bridge.exe
            dist/NSE-MT5-Bridge-Setup-*.exe
          if-no-files-found: error

  # Cross-platform builds (v1.3.0): macOS x64 + arm64, Linux x64 + arm64.
  # One matrix job — the steps are identical except the packaging
  # (macOS .app -> .dmg via hdiutil; Linux binary -> tarball).
  # PyInstaller cannot cross-compile: each OS/arch builds natively on
  # its own runner. Every runner re-runs the gates (lint + format +
  # mypy + security + unit/mock-integration tests) so a
  # platform-specific import failure fails HERE, not at release time.
  # MT5 is Windows-x64-only by design: the core (server, UI, platform
  # channel) builds and runs on macOS/Linux, terminal attach reports
  # MT5_WINDOWS_REQUIRED — never faked. The headless smoke boots the
  # frozen binary with --console and asserts /health + /ui + a
  # parseable `status --json` — no MT5 terminal, no GUI display needed.
  build-unix:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            platform: macos-x64
            artifact_glob: dist/*.dmg
          - os: macos-latest
            arch: arm64
            platform: macos-arm64
            artifact_glob: dist/*.dmg
          - os: ubuntu-latest
            arch: x64
            platform: linux-x64
            artifact_glob: dist/*.tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux-arm64
            artifact_glob: dist/*.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (whole repo)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Static analysis (mypy)
        run: python -m mypy nse_bridge

      - name: Security checks (bandit + pip-audit)
        # Same skips as test-linux (see the comment there).
        run: |
          python -m bandit -r nse_bridge --skip B101,B110,B311,B404 -q
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

      - name: Run unit + mock-integration tests
        run: python -m pytest tests/unit tests/integration -q --junitxml=test-results.xml -rf

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.platform }}
          path: test-results.xml
          if-no-files-found: warn

      - name: Build frozen binary
        run: pyinstaller bridge.spec --noconfirm --clean

      - name: Headless smoke-check the frozen binary
        # Boots the frozen binary with --console (foreground, no GUI),
        # polls /health until ready, asserts /ui serves 200 and
        # `status --json` parses against the RUNNING instance. No MT5
        # terminal exists on these runners — MT5 fields honestly
        # report down/unknown. The trap kills the server on any exit
        # path (bash -e is on for this step).
        shell: bash
        run: |
          BIN=dist/NSE-MT5-Bridge
          if [ "${{ runner.os }}" = "macOS" ]; then
            BIN="dist/NSE-MT5-Bridge.app/Contents/MacOS/NSE-MT5-Bridge"
          fi
          test -x "$BIN" || { echo "frozen binary missing: $BIN"; ls -R dist; exit 1; }
          "$BIN" --help > /dev/null
          "$BIN" --console --port 8799 > /tmp/bridge-smoke.log 2>&1 &
          SMOKE_PID=$!
          trap 'kill $SMOKE_PID 2>/dev/null || true' EXIT
          READY=0
          for _ in $(seq 1 180); do
            if curl -fsS --max-time 2 http://127.0.0.1:8799/health > /dev/null 2>&1; then READY=1; break; fi
            sleep 0.5
          done
          if [ "$READY" != "1" ]; then echo "--- bridge smoke log ---"; tail -40 /tmp/bridge-smoke.log; exit 1; fi
          curl -fsS --max-time 15 http://127.0.0.1:8799/ui > /dev/null
          "$BIN" status --json > /tmp/bridge-status.json
          python -c "import json; json.load(open('/tmp/bridge-status.json'))"
          echo "frozen binary headless smoke OK (${{ matrix.platform }})"

      - name: Package artifact (macOS .dmg / Linux tarball)
        shell: bash
        run: |
          VER=$(python -c "from nse_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION, end='')")
          if [ "${{ runner.os }}" = "macOS" ]; then
            hdiutil create -volname "NSE MT5 Bridge $VER" -srcfolder dist/NSE-MT5-Bridge.app -ov -format UDZO "dist/NSE-MT5-Bridge-$VER-macos-${{ matrix.arch }}.dmg"
            ls -la dist/*.dmg
          else
            mkdir -p "pkg/NSE-MT5-Bridge-$VER-linux-${{ matrix.arch }}"
            cp dist/NSE-MT5-Bridge "pkg/NSE-MT5-Bridge-$VER-linux-${{ matrix.arch }}/"
            tar -czf "dist/NSE-MT5-Bridge-$VER-linux-${{ matrix.arch }}.tar.gz" -C pkg "NSE-MT5-Bridge-$VER-linux-${{ matrix.arch }}"
            ls -la dist/*.tar.gz
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NSE-MT5-Bridge-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # Windows ARM64 (v1.3.0): native-arm64 build of the bridge CORE only.
  # The MetaTrader5 wheel has no win_arm64 build, so pip (marker:
  # platform_machine == 'AMD64') skips it and bridge.spec skips
  # collecting it — the exe runs (dashboard, platform channel) but
  # terminal attach reports MT5_WINDOWS_REQUIRED. Trading on ARM64
  # Windows uses the x64 build, which runs under emulation and CAN
  # attach. Portable exe only, no Inno installer (the .iss is x64).
  build-windows-arm:
    needs: test-linux
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        # MetaTrader5 is skipped on this runner by its platform marker
        # (win_amd64 wheel only) — the install must still succeed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (whole repo)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Static analysis (mypy)
        run: python -m mypy nse_bridge

      - name: Security checks (bandit + pip-audit)
        # Same skips as test-linux (see the comment there). pip-audit
        # ignores below are Windows-ARM64 ONLY: cryptography 46.0.3 is
        # the newest release with a win_arm64 wheel (46.0.4+ ship none,
        # including the 46.0.5/46.0.6/46.0.7 fixes), so these findings
        # have no installable fix on this platform. The bridge does not
        # exercise the affected paths (PKCS#7 decryption, custom X.509
        # verification, SECT curves); re-check when upstream publishes
        # a win_arm64 wheel for a fixed release, then drop the ignores.
        run: |
          python -m bandit -r nse_bridge --skip B101,B110,B311,B404 -q
          # One line on purpose: this step runs under pwsh, which does
          # NOT accept backslash line continuations (a multi-line
          # pip_audit with "\" died with a ParserError).
          python -m pip_audit -r requirements.txt -r requirements-dev.txt --ignore-vuln PYSEC-2026-2141 --ignore-vuln PYSEC-2026-35 --ignore-vuln PYSEC-2026-36 --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554 --ignore-vuln GHSA-537c-gmf6-5ccf

      - name: Run unit + mock-integration tests on Windows ARM64
        run: python -m pytest tests/unit tests/integration -q --junitxml=test-results.xml -rf

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows-arm64
          path: test-results.xml
          if-no-files-found: warn

      - name: Build single-file exe (core-only, no MT5 driver)
        run: pyinstaller bridge.spec --noconfirm --clean

      - name: Smoke-check the frozen exe (headless)
        # Same shape as the x64 smoke, trimmed: --help, serve +
        # /health + /ui, and one parseable `status --json`. The full
        # CLI contract + single-instance check are covered by the x64
        # job; no MT5 terminal exists on this runner either.
        shell: pwsh
        run: |
          dist/NSE-MT5-Bridge.exe --help
          $proc = Start-Process -FilePath "dist/NSE-MT5-Bridge.exe" -ArgumentList "--console","--port","8799" -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            $ready = $false
            while ((Get-Date) -lt $deadline -and -not $ready) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-WebRequest -Uri "http://127.0.0.1:8799/health" -UseBasicParsing -TimeoutSec 2
                if ($h.StatusCode -eq 200) { $ready = $true }
              } catch { }
            }
            if (-not $ready) { throw "frozen exe (ARM64) /health did not become ready within 90 s" }
            $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8799/ui" -UseBasicParsing -TimeoutSec 15
            if ($ui.StatusCode -ne 200) { throw "/ui (bundled GUI asset) answered HTTP $($ui.StatusCode)" }
            $outFile = Join-Path $env:TEMP "cli-status.json"
            $errFile = Join-Path $env:TEMP "cli-status.err.txt"
            $cp = Start-Process -FilePath "dist/NSE-MT5-Bridge.exe" `
              -ArgumentList "status --json" -Wait -PassThru `
              -RedirectStandardOutput $outFile -RedirectStandardError $errFile
            if ($cp.ExitCode -ne 0) {
              Write-Host "--- cli stderr ---"; Get-Content $errFile | Write-Host
              throw "CLI 'status' exited with $($cp.ExitCode)"
            }
            Get-Content $outFile -Raw | ConvertFrom-Json > $null
            Write-Host "frozen exe (ARM64) headless smoke OK"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Rename artifact with platform suffix
        # The x64 exe keeps the canonical name (install.ps1 + the
        # updater expect it); the ARM64 exe is renamed so the release
        # can carry both without a filename collision.
        shell: pwsh
        run: |
          $ver = python -c "from nse_bridge import BRIDGE_VERSION; print(BRIDGE_VERSION, end='')"
          Rename-Item dist/NSE-MT5-Bridge.exe "NSE-MT5-Bridge-$ver-windows-arm64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NSE-MT5-Bridge-windows-arm64
          path: dist/NSE-MT5-Bridge-*-windows-arm64.exe
          if-no-files-found: error

  # Local-processing benchmark (mission §B3 regression tracking). NOT
  # on PRs (keeps PR checks fast): runs on main pushes, tags, and
  # manual dispatch, uploading the JSON report as an artifact so
  # per-commit numbers are comparable over time. The numbers are
  # LOCAL processing only (fake driver, no MT5 IPC, no network — see
  # scripts/bench_local_api.py) and runner-specific; compare
  # same-workflow runs, never the dev-machine baselines in
  # docs/PERFORMANCE.md.
  bench:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Run local-processing benchmark
        run: python scripts/bench_local_api.py --samples 400 --out bench-report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-report-${{ github.sha }}
          path: bench-report.json
          if-no-files-found: error

  # Release: tags only. All six platform artifacts are checksummed +
  # manifested here, and every file (artifact + .sha256 sidecar +
  # manifest) is attached to the GitHub release. No release is ever
  # cut from an untested build: this job needs build-windows,
  # build-windows-arm and build-unix, which each ran the gates and a
  # frozen-binary smoke on their own runner.
  release:
    needs: [build-windows, build-windows-arm, build-unix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NSE-MT5-Bridge-windows
          path: dist/NSE-MT5-Bridge-windows

      - name: Download Windows ARM64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NSE-MT5-Bridge-windows-arm64
          path: dist/NSE-MT5-Bridge-windows-arm64

      - name: Download macOS x64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NSE-MT5-Bridge-macos-x64
          path: dist/NSE-MT5-Bridge-macos-x64

      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NSE-MT5-Bridge-macos-arm64
          path: dist/NSE-MT5-Bridge-macos-arm64

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NSE-MT5-Bridge-linux-x64
          path: dist/NSE-MT5-Bridge-linux-x64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: NSE-MT5-Bridge-linux-arm64
          path: dist/NSE-MT5-Bridge-linux-arm64

      - name: Checksum + release manifest
        # Stage every artifact flat into dist/ first: the manifest
        # script writes the .sha256 sidecars next to the names the
        # attach step globs, and install.ps1 verifies by bare filename.
        shell: pwsh
        run: |
          $setupSrc = (Get-Item dist/NSE-MT5-Bridge-windows/NSE-MT5-Bridge-Setup-*.exe).FullName
          $armSrc = (Get-Item dist/NSE-MT5-Bridge-windows-arm64/NSE-MT5-Bridge-*-windows-arm64.exe).FullName
          $dmgX64Src = (Get-Item dist/NSE-MT5-Bridge-macos-x64/*.dmg).FullName
          $dmgArmSrc = (Get-Item dist/NSE-MT5-Bridge-macos-arm64/*.dmg).FullName
          $tgzX64Src = (Get-Item dist/NSE-MT5-Bridge-linux-x64/*.tar.gz).FullName
          $tgzArmSrc = (Get-Item dist/NSE-MT5-Bridge-linux-arm64/*.tar.gz).FullName
          Copy-Item dist/NSE-MT5-Bridge-windows/NSE-MT5-Bridge.exe, $setupSrc, $armSrc, $dmgX64Src, $dmgArmSrc, $tgzX64Src, $tgzArmSrc dist/
          $setup = (Get-Item dist/NSE-MT5-Bridge-Setup-*.exe).FullName
          $armExe = (Get-Item dist/NSE-MT5-Bridge-*-windows-arm64.exe).FullName
          $dmgX64 = (Get-Item dist/NSE-MT5-Bridge-*-macos-x64.dmg).FullName
          $dmgArm = (Get-Item dist/NSE-MT5-Bridge-*-macos-arm64.dmg).FullName
          $tgzX64 = (Get-Item dist/NSE-MT5-Bridge-*-linux-x64.tar.gz).FullName
          $tgzArm = (Get-Item dist/NSE-MT5-Bridge-*-linux-arm64.tar.gz).FullName
          python scripts/write_release_manifest.py dist/NSE-MT5-Bridge.exe --setup $setup --tag ${{ github.ref_name }} --out-dir dist `
            --extra "windows-arm64:$armExe" `
            --extra "macos-x64:$dmgX64" --extra "macos-arm64:$dmgArm" `
            --extra "linux-x64:$tgzX64" --extra "linux-arm64:$tgzArm"
          Get-ChildItem dist/*.sha256, dist/release-manifest.json | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_ }

      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/NSE-MT5-Bridge.exe
            dist/NSE-MT5-Bridge.exe.sha256
            dist/NSE-MT5-Bridge-Setup-*.exe
            dist/NSE-MT5-Bridge-Setup-*.exe.sha256
            dist/NSE-MT5-Bridge-*-windows-arm64.exe
            dist/NSE-MT5-Bridge-*-windows-arm64.exe.sha256
            dist/NSE-MT5-Bridge-*-macos-x64.dmg
            dist/NSE-MT5-Bridge-*-macos-x64.dmg.sha256
            dist/NSE-MT5-Bridge-*-macos-arm64.dmg
            dist/NSE-MT5-Bridge-*-macos-arm64.dmg.sha256
            dist/NSE-MT5-Bridge-*-linux-x64.tar.gz
            dist/NSE-MT5-Bridge-*-linux-x64.tar.gz.sha256
            dist/NSE-MT5-Bridge-*-linux-arm64.tar.gz
            dist/NSE-MT5-Bridge-*-linux-arm64.tar.gz.sha256
            dist/release-manifest.json
          # v1.2.3-rc.1 (or any tag containing '-') is a prerelease;
          # v1.2.3 is stable. The two are never mixed in one release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
